<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chisap CRM · Backoffice</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/brand.css">
<style>
/* ── extras del backoffice ── */
.hdr-gam{display:flex;align-items:center;gap:12px;background:var(--sup);border:1px solid var(--linea);
  border-radius:99px;padding:6px 14px 6px 8px}
.hdr-gam .nivel-e{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--rojo),var(--rojo-osc));
  display:grid;place-items:center;font-size:17px}
.hdr-gam .xp-bar{width:90px;height:6px;background:var(--fondo);border-radius:99px;overflow:hidden}
.hdr-gam .xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--oro),var(--oro-claro));border-radius:99px;transition:width .6s}
.hdr-gam small{font-size:10px;color:var(--tinta3);display:block;line-height:1.2}
.hdr-gam b{font-family:var(--disp);font-size:11.5px;line-height:1.2;display:block}
.vista{display:none}
.vista.act{display:block;animation:vIn .35s cubic-bezier(.2,.75,.25,1)}
@keyframes vIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* actividad dot (patrón Pipedrive) */
.act-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.act-verde{background:var(--verde)} .act-amarillo{background:var(--oro)} .act-rojo{background:var(--rojo-vivo)} .act-gris{background:#4A4A56}
/* drop zones al arrastrar */
#dropZones{position:fixed;left:0;right:0;bottom:-90px;z-index:70;display:flex;gap:14px;padding:14px 22px;transition:bottom .25s}
#dropZones.show{bottom:0}
.dz{flex:1;border-radius:16px;border:2px dashed;padding:20px;text-align:center;font-family:var(--disp);
  font-weight:800;font-size:15px;backdrop-filter:blur(8px);transition:all .2s}
.dz-perdido{border-color:var(--rojo-vivo);background:rgba(226,35,26,.16);color:var(--rojo-luz)}
.dz-firmado{border-color:var(--verde);background:rgba(37,211,102,.14);color:var(--verde)}
.dz.over{transform:scale(1.03);filter:brightness(1.3)}
/* command palette */
#cmdk{position:fixed;inset:0;z-index:150;display:none;align-items:flex-start;justify-content:center;
  padding-top:12vh;background:rgba(6,6,10,.6);backdrop-filter:blur(4px)}
#cmdk.open{display:flex}
.cmdk-box{width:min(560px,94vw);background:var(--sup);border:1px solid var(--linea);border-radius:18px;
  box-shadow:var(--sombra);overflow:hidden;animation:modalIn .25s cubic-bezier(.2,.75,.25,1)}
.cmdk-box input{width:100%;border:0;border-bottom:1px solid var(--linea);border-radius:0;padding:17px 20px;font-size:15.5px;background:transparent}
.cmdk-list{max-height:340px;overflow-y:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;cursor:pointer;font-size:13.5px}
.cmdk-item.sel,.cmdk-item:hover{background:rgba(242,183,5,.1)}
.cmdk-item .e{width:24px;text-align:center}
.cmdk-item kbd{margin-left:auto;font-size:10px;background:var(--fondo);border:1px solid var(--linea);
  border-radius:5px;padding:2px 7px;color:var(--tinta3);font-family:var(--texto)}
kbd.k{font-size:10.5px;background:var(--fondo);border:1px solid var(--linea);border-radius:5px;padding:2px 7px;color:var(--tinta3)}
/* scoring editor */
.regla{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea)}
.regla:last-child{border:0}
.regla .txt{font-size:13px;color:var(--tinta2)}
.stepper{display:flex;align-items:center;gap:2px;background:var(--fondo);border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.stepper button{background:none;border:0;color:var(--tinta3);width:26px;height:30px;font-size:15px;font-weight:800}
.stepper button:hover{background:rgba(255,255,255,.08);color:var(--oro)}
.stepper span{flex:1;text-align:center;font-family:var(--disp);font-weight:800;font-size:13px;min-width:30px}
.score-preview{position:sticky;top:20px}
.rango{display:flex;align-items:center;gap:10px}
.rango input[type=range]{flex:1;accent-color:var(--oro);padding:0;border:0;background:transparent}
/* timeline vertical del lead */
.tline{position:relative;padding-left:24px;display:grid;gap:13px}
.tline:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--linea);border-radius:2px}
.tev{position:relative;font-size:12.5px;color:var(--tinta3)}
.tev:before{content:'';position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;
  background:var(--sup3);border:2px solid var(--linea)}
.tev.hito:before{background:var(--oro);border-color:var(--oro-osc)}
.tev b{color:var(--tinta);display:block;font-size:12.5px}
.tev small{font-size:10.5px;color:var(--tinta3)}
/* logros */
.logro{display:flex;gap:13px;align-items:center;background:var(--sup);border:1px solid var(--linea);
  border-radius:15px;padding:15px;transition:var(--t)}
.logro .e{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px;
  background:linear-gradient(140deg,rgba(242,183,5,.25),rgba(242,183,5,.06));border:1px solid rgba(242,183,5,.35)}
.logro.off{opacity:.42;filter:grayscale(.8)}
.logro.off .e{background:var(--fondo);border-color:var(--linea)}
.logro b{font-family:var(--disp);font-size:13.5px;display:block}
.logro p{font-size:11.5px;color:var(--tinta3)}
.logro .xp{margin-left:auto;font-family:var(--disp);font-weight:800;font-size:12px;color:var(--oro);white-space:nowrap}
/* leaderboard */
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;background:var(--sup2);
  border:1px solid var(--linea);margin-bottom:9px}
.lb-row .pos{font-family:var(--disp);font-weight:900;font-size:17px;width:26px;color:var(--tinta3)}
.lb-row.top .pos{color:var(--oro)}
.lb-row .em{font-size:23px}
.lb-row .bar-mini{height:7px;background:var(--fondo);border-radius:99px;overflow:hidden;margin-top:5px}
.lb-row .bar-mini i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rojo-vivo),var(--oro));transition:width .8s}
/* tour */
.tour-paso{position:fixed;z-index:160;background:var(--sup);border:1px solid var(--oro);border-radius:15px;
  padding:17px 19px;max-width:300px;box-shadow:var(--sombra);animation:modalIn .3s}
.tour-paso b{font-family:var(--disp);display:block;margin-bottom:5px;font-size:14px}
.tour-paso p{font-size:12.5px;color:var(--tinta3)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros select,.filtros input{padding:8px 11px;font-size:12.5px;border-radius:9px}
.tag-nuevo{position:absolute;top:-7px;left:12px;background:var(--verde);color:#06371b;font-size:9px;
  font-weight:900;padding:2px 8px;border-radius:99px;letter-spacing:.06em}
.burger-btn{display:none;position:fixed;bottom:18px;left:14px;z-index:60}
@media(max-width:960px){.burger-btn{display:inline-flex}}
@media print{.sidebar,#dropZones,#toasts,.burger-btn{display:none!important}.app{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- ══════ SIDEBAR ══════ -->
  <aside class="sidebar" id="sidebar">
    <div class="logo"><img src="assets/logo.png" alt="Chisap"><div><b style="font-family:var(--disp);font-size:13px;display:block">Chisap CRM</b><small style="font-size:10px;color:var(--tinta3)">Backoffice · demo</small></div></div>
    <button class="nav-item" data-v="dashboard"><span class="e">📊</span>Dashboard</button>
    <button class="nav-item" data-v="pipeline"><span class="e">🧲</span>Pipeline<span class="badge" id="badgeNuevos"></span></button>
    <button class="nav-item" data-v="leads"><span class="e">👥</span>Leads</button>
    <button class="nav-item" data-v="scoring"><span class="e">🎛️</span>Scoring</button>
    <button class="nav-item" data-v="equipo"><span class="e">🏆</span>Equipo y logros</button>
    <button class="nav-item" data-v="glosario"><span class="e">📖</span>Glosario</button>
    <button class="nav-item" data-v="config"><span class="e">⚙️</span>Configuración</button>
    <div style="flex:1"></div>
    <div class="card" style="padding:13px;font-size:11px;color:var(--tinta3)">
      💡 <b style="color:var(--oro)">Tip:</b> apretá <kbd class="k">?</kbd> para ver los atajos o <kbd class="k">Ctrl K</kbd> para buscar.
    </div>
    <a class="nav-item" href="tutoriales.html"><span class="e">🎬</span>Tutoriales en video</a>
    <a class="nav-item" href="index.html"><span class="e">🧭</span>Hub de la demo</a>
    <a class="nav-item" href="landing.html"><span class="e">🌐</span>Ver la landing</a>
  </aside>

  <!-- ══════ MAIN ══════ -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="vTitulo">Dashboard</h1>
        <div class="sub" id="vSub">El pulso del negocio, en vivo</div>
      </div>
      <div style="display:flex;gap:11px;align-items:center;flex-wrap:wrap">
        <div class="hdr-gam tooltip" data-tip="Tu progreso de colaborador" id="gamWidget"></div>
        <button class="btn btn-oro btn-sm" onclick="abrirNuevoLead()">＋ Nuevo lead</button>
      </div>
    </div>
    <div id="vistas">
      <section class="vista" id="v-dashboard"></section>
      <section class="vista" id="v-pipeline"></section>
      <section class="vista" id="v-leads"></section>
      <section class="vista" id="v-scoring"></section>
      <section class="vista" id="v-equipo"></section>
      <section class="vista" id="v-glosario"></section>
      <section class="vista" id="v-config"></section>
    </div>
  </main>
</div>

<!-- drop zones (aparecen al arrastrar) -->
<div id="dropZones">
  <div class="dz dz-perdido" data-dz="perdido">✕ PERDIDO — soltá acá</div>
  <div class="dz dz-firmado" data-dz="firmado">🏆 FIRMADO — soltá acá</div>
</div>

<!-- drawer detalle de lead -->
<div class="overlay" id="ovl" onclick="cerrarDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Detalle del lead"></aside>

<!-- command palette -->
<div id="cmdk"><div class="cmdk-box">
  <input id="cmdkInput" placeholder="Buscá un lead o una acción…  (Esc para cerrar)" autocomplete="off">
  <div class="cmdk-list" id="cmdkList"></div>
</div></div>

<!-- modal genérico -->
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

<div id="toasts"></div>

<script src="assets/store.js"></script>
<script src="assets/charts.js"></script>
<script>
'use strict';
/* ═══════════════ helpers ═══════════════ */
function $(s, c){ return (c || document).querySelector(s); }
function $$(s, c){ return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fechaCorta(t){ var d = new Date(t); return d.getDate() + ' ' + ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]; }
function hace(t){
  var d = Math.max(0, Math.floor((Date.now() - t) / 86400000));
  return d === 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días';
}
var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function toast(titulo, msg, accionTxt, accionFn){
  var t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = '<span style="font-size:19px">✅</span><div style="flex:1"><b>' + esc(titulo) + '</b>' +
    (msg ? '<p>' + esc(msg) + '</p>' : '') + '</div>' +
    (accionTxt ? '<button class="btn btn-ghost btn-sm" style="padding:5px 12px;font-size:11.5px">' + esc(accionTxt) + '</button>' : '');
  if (accionTxt) $('button', t).onclick = function(){ accionFn(); quitar(); };
  $('#toasts').appendChild(t);
  function quitar(){ t.classList.add('exit'); setTimeout(function(){ t.remove(); }, 300); }
  setTimeout(quitar, 5200);
}
function confeti(n){
  if (reduceMotion) return;
  var colores = ['#F2B705','#E2231A','#25D366','#7B95FF','#FFD54A'];
  for (var i = 0; i < n; i++){
    var c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-12px';
    c.style.background = colores[i % colores.length];
    c.style.animationDelay = (Math.random() * .6) + 's';
    document.body.appendChild(c);
    setTimeout(function(el){ return function(){ el.remove(); }; }(c), 3300);
  }
}
function equipo(id){ return CRM.EQUIPO.find(function(e){ return e.id === id; }) || { nombre: '—', emoji: '❔' }; }
/* punto de actividad estilo Pipedrive */
function actividadDot(l){
  if (l.etapa === 'firmado' || l.etapa === 'perdido') return '';
  var d = CRM.diasSinActividad(l), sla = CRM.state().config.slaDias;
  var cls = d === 0 ? 'act-verde' : d <= Math.ceil(sla / 2) ? 'act-amarillo' : d <= sla ? 'act-gris' : 'act-rojo';
  var tip = d === 0 ? 'Con actividad hoy' : d + ' día' + (d > 1 ? 's' : '') + ' sin actividad';
  return '<span class="act-dot ' + cls + ' tooltip" data-tip="' + tip + '"></span>';
}

/* ═══════════════ navegación ═══════════════ */
var VISTAS = {
  dashboard: { t: 'Dashboard', s: 'El pulso del negocio, en vivo', fn: rDashboard },
  pipeline:  { t: 'Pipeline', s: 'Arrastrá los leads entre etapas — o soltalos abajo para cerrar', fn: rPipeline },
  leads:     { t: 'Leads', s: 'Todos los candidatos, con filtros y export', fn: rLeads },
  scoring:   { t: 'Scoring editable', s: 'Ajustá los puntos y mirá el recálculo en vivo', fn: rScoring },
  equipo:    { t: 'Equipo y logros', s: 'Metas, ranking y tu progreso de colaborador', fn: rEquipo },
  glosario:  { t: 'Glosario visual', s: 'Los términos del CRM sin traductor', fn: rGlosario },
  config:    { t: 'Configuración', s: 'Etapas, SLA, metas y reset de la demo', fn: rConfig }
};
var vistaActual = 'dashboard';
function ir(v){
  vistaActual = v;
  location.hash = '/' + v;
  $$('.nav-item[data-v]').forEach(function(n){ n.classList.toggle('act', n.dataset.v === v); });
  $$('.vista').forEach(function(x){ x.classList.remove('act'); });
  var el = $('#v-' + v); el.classList.add('act');
  $('#vTitulo').textContent = VISTAS[v].t;
  $('#vSub').textContent = VISTAS[v].s;
  VISTAS[v].fn(el);
  CRM.marcarSeccion(v);
  renderGam();
  chequearLogro();
  $('#sidebar').classList.remove('open');
}
$$('.nav-item[data-v]').forEach(function(n){ n.onclick = function(){ ir(n.dataset.v); }; });

/* ═══════════════ gamificación (header) ═══════════════ */
function renderGam(){
  var nv = CRM.nivel(), st = CRM.state();
  $('#gamWidget').innerHTML =
    '<div class="nivel-e">' + nv.actual.emoji + '</div>' +
    '<div><b>' + nv.actual.nombre + ' · ' + st.gam.xp + ' XP</b>' +
    '<div class="xp-bar"><i style="width:' + nv.progreso + '%"></i></div>' +
    '<small>' + (nv.siguiente ? (nv.siguiente.min - st.gam.xp) + ' XP para ' + nv.siguiente.nombre : 'Nivel máximo') + '</small></div>' +
    '<span style="font-size:15px" class="tooltip" data-tip="Racha de actividad">🔥' + st.gam.racha + '</span>';
  var nuevos = CRM.leads({ etapa: 'nuevo' }).length;
  $('#badgeNuevos').textContent = nuevos || '';
  $('#badgeNuevos').style.display = nuevos ? 'grid' : 'none';
}
var logroMostrado = {};
function chequearLogro(){
  var ul = CRM.state().gam.ultimoLogro;
  if (ul && !logroMostrado[ul]){
    logroMostrado[ul] = 1;
    var lg = CRM.LOGROS.find(function(x){ return x.id === ul; });
    if (lg) toast(lg.emoji + ' ¡Logro desbloqueado: ' + lg.nombre + '!', lg.desc + ' · +' + lg.xp + ' XP');
    CRM.state().gam.ultimoLogro = null; CRM.save();
  }
}

/* ═══════════════ VISTA · DASHBOARD ═══════════════ */
function rDashboard(el){
  var m = CRM.metricas(), st = CRM.state();
  var meta = st.config.metaMensualFirmas, pctMeta = Math.min(100, Math.round(100 * m.firmadosMes / meta));
  var activos = m.total - m.porEtapa.firmado - m.porEtapa.perdido;
  el.innerHTML =
  '<div class="g c4">' +
    '<div class="kpi oro"><span class="d up">este mes</span><div class="n">' + m.nuevosMes + '</div><div class="l">Leads nuevos del mes</div></div>' +
    '<div class="kpi azul"><div class="n">' + activos + '</div><div class="l">Leads activos en el pipeline</div></div>' +
    '<div class="kpi verde"><div class="n">' + m.firmadosMes + '<small>/' + meta + '</small></div><div class="l">Firmas del mes vs meta</div></div>' +
    '<div class="kpi ' + (m.fueraSLA ? 'rojo' : '') + '"><div class="n">' + m.fueraSLA + '</div><div class="l">Leads enfriándose (fuera de SLA)</div></div>' +
  '</div>' +
  '<div class="card" style="margin-top:16px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">' +
    '<b style="font-family:var(--disp);font-size:14px">🎯 Meta del mes: ' + meta + ' franquicias firmadas</b>' +
    '<span class="pill ' + (pctMeta >= 100 ? 'verde' : 'oro') + '">' + pctMeta + '%</span></div>' +
    '<div class="bar" style="margin:0"><div class="tk" style="height:14px"><div class="fl ' + (pctMeta >= 100 ? 'verde' : 'oro') + '" style="width:' + pctMeta + '%"></div></div></div>' +
    (pctMeta >= 100 ? '<p style="font-size:12px;color:var(--verde);margin-top:7px">🏆 ¡Meta cumplida! Todo lo que venga ahora es récord.</p>'
      : '<p style="font-size:12px;color:var(--tinta3);margin-top:7px">Faltan ' + (meta - m.firmadosMes) + ' firma' + (meta - m.firmadosMes !== 1 ? 's' : '') + ' — hay ' + m.porEtapa.propuesta + ' en Propuesta y ' + m.porEtapa.visita + ' en Visita.</p>') +
  '</div>' +
  '<div class="g c2" style="margin-top:16px">' +
    '<div class="ch"><h4>Embudo del pipeline</h4><div class="s">Cuántos llegaron al menos a cada etapa (% sobre el total)</div><div id="chFunnel"></div></div>' +
    '<div class="ch"><h4>Leads nuevos por semana</h4><div class="s">Últimas 10 semanas</div><div id="chSerie"></div>' +
    '<div class="leg"><span><i style="background:var(--oro)"></i>Leads captados</span></div></div>' +
  '</div>' +
  '<div class="g c2" style="margin-top:16px">' +
    '<div class="ch"><h4>Temperatura de la base</h4><div class="s">Según el scoring vigente — editable en 🎛️ Scoring</div><div id="chSeg"></div></div>' +
    '<div class="ch"><h4>Origen de los leads</h4><div class="s">De dónde llega cada candidato</div><div id="chOrigen"></div></div>' +
  '</div>' +
  '<div class="card" style="margin-top:16px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">' +
    '<b style="font-family:var(--disp);font-size:14px">🚨 Para accionar ya — leads que se enfrían</b>' +
    '<button class="btn btn-ghost btn-sm" onclick="ir(\'pipeline\')">Ir al pipeline →</button></div>' +
    '<div id="listaFrios"></div>' +
  '</div>';
  Charts.funnel($('#chFunnel'), m.funnel);
  Charts.linea($('#chSerie'), m.serieSemanal, { labels: m.serieSemanal.map(function(_, i){ return i % 2 ? '' : 'S-' + (9 - i); }) });
  Charts.donut($('#chSeg'), [
    { label: '🔥 Calientes', valor: m.porSegmento.caliente, color: '#25D366' },
    { label: '🌤️ Tibios', valor: m.porSegmento.tibio, color: '#F2B705' },
    { label: '🧊 Fríos', valor: m.porSegmento.frio, color: '#7B95FF' }
  ], { centro: m.total, centroSub: 'leads' });
  var org = Object.keys(m.porOrigen).map(function(k){ return { label: k.replace(' Ads',''), valor: m.porOrigen[k] }; })
    .sort(function(a, b){ return b.valor - a.valor; });
  org.forEach(function(o, i){ o.destacar = i === 0; });
  Charts.barras($('#chOrigen'), org, { fsx: 8.6 });
  var frios = CRM.leads().filter(function(l){ return l.etapa !== 'firmado' && l.etapa !== 'perdido' && !CRM.enSLA(l); })
    .sort(function(a, b){ return b.score - a.score; }).slice(0, 5);
  $('#listaFrios').innerHTML = frios.length ? frios.map(function(l){
    return '<div class="lb-row" style="cursor:pointer" onclick="abrirLead(\'' + l.id + '\')">' +
      '<span style="font-size:17px">🥶</span><div style="flex:1"><b style="font-family:var(--disp);font-size:13px">' + esc(l.nombre) + '</b>' +

/* ═══════════════ VISTA · PIPELINE (kanban) ═══════════════ */
var dragId = null;
function rPipeline(el){
  var filtro = el.dataset.filtro || '';
  var leads = CRM.leads().filter(function(l){ return l.etapa !== 'perdido'; });
  if (filtro) leads = leads.filter(function(l){ return l.segmento.id === filtro; });
  var html = '<div class="filtros" style="margin-bottom:15px">' +
    '<span class="micro">Filtrar:</span>' +
    ['', 'caliente', 'tibio', 'frio'].map(function(f){
      var lbl = f === '' ? 'Todos' : f === 'caliente' ? '🔥 Calientes' : f === 'tibio' ? '🌤️ Tibios' : '🧊 Fríos';
      return '<button class="btn ' + (filtro === f ? 'btn-oro' : 'btn-ghost') + ' btn-sm" onclick="filtrarPipe(\'' + f + '\')">' + lbl + '</button>';
    }).join('') +
    '<span style="flex:1"></span>' +
    '<span class="pill">💡 Arrastrá una tarjeta — abajo aparecen las zonas Firmado / Perdido</span>' +
    '</div><div class="kanban" id="kanban">';
  CRM.ETAPAS.forEach(function(e){
    var ls = leads.filter(function(l){ return l.etapa === e.id; })
      /* los leads creados en esta demo se fijan arriba (la landing promete verlos primero) */
      .sort(function(a, b){ return (b.nuevoDemo ? 1 : 0) - (a.nuevoDemo ? 1 : 0) || b.score - a.score; });
    html += '<div class="col" data-etapa="' + e.id + '">' +
      '<div class="col-h"><span class="dot" style="background:' + e.color + '"></span><b>' + e.emoji + ' ' + e.nombre + '</b><span class="cnt">' + ls.length + '</span></div>' +
      '<div class="col-body">' +
      (ls.length ? ls.map(cardLead).join('') :
        '<div class="empty-col">' + (e.id === 'nuevo' ? '✨ Los leads de la landing caen acá.<br>¡Probá el wizard!' : 'Arrastrá un lead hasta acá') + '</div>') +
      '</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
  activarDnD();
}
function filtrarPipe(f){ var el = $('#v-pipeline'); el.dataset.filtro = f; rPipeline(el); }
function cardLead(l){
  var eq = equipo(l.asignado);
  var fueraSLA = l.etapa !== 'firmado' && !CRM.enSLA(l);
  return '<div class="lead-card" draggable="true" data-id="' + l.id + '" onclick="abrirLead(\'' + l.id + '\')" tabindex="0" ' +
    'onkeydown="if(event.key===\'Enter\')abrirLead(\'' + l.id + '\')">' +
    (l.nuevoDemo ? '<span class="tag-nuevo">TU LEAD</span>' : '') +
    (fueraSLA ? '<span class="alerta-sla tooltip" data-tip="' + CRM.diasSinActividad(l) + ' días sin actividad">⏰</span>' : '') +
    '<div class="nm"><span style="display:flex;gap:7px;align-items:center;min-width:0">' + actividadDot(l) +
    '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(l.nombre) + '</span></span>' +
    '<span class="score-chip sc-' + l.segmento.id + '">' + l.score + '</span></div>' +
    '<div class="zn">📍 ' + esc(l.zona) + ' · ' + esc(l.origen) + '</div>' +
    '<div class="ft"><span class="avatar tooltip" data-tip="' + eq.nombre + '">' + eq.emoji + '</span>' +
    '<span style="font-size:10.5px;color:var(--tinta3)">' + hace(l.ultimaActividad) + '</span>' +
    '<button class="btn btn-ghost btn-sm tooltip" data-tip="Mover a otra etapa" style="margin-left:auto;padding:3px 9px;font-size:10.5px" onclick="event.stopPropagation();menuMover(\'' + l.id + '\', this)">Mover ▾</button></div></div>';
}
function activarDnD(){
  $$('.lead-card').forEach(function(c){
    c.addEventListener('dragstart', function(e){
      dragId = c.dataset.id; c.classList.add('dragging');
      $('#dropZones').classList.add('show');
      try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
    });
    c.addEventListener('dragend', function(){
      c.classList.remove('dragging'); $('#dropZones').classList.remove('show');
      $$('.col,.dz').forEach(function(x){ x.classList.remove('drag-over', 'over'); });
    });
  });
  $$('.col').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('drag-over'); });
    col.addEventListener('drop', function(e){
      e.preventDefault(); col.classList.remove('drag-over');
      if (dragId) moverCon(dragId, col.dataset.etapa);
    });
  });
  $$('.dz').forEach(function(dz){
    dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', function(){ dz.classList.remove('over'); });
    dz.addEventListener('drop', function(e){
      e.preventDefault(); dz.classList.remove('over');
      if (dragId) moverCon(dragId, dz.dataset.dz);
    });
  });
}
function moverCon(id, etapa){
  var l = CRM.lead(id);
  if (!l || l.etapa === etapa) return;
  var desde = l.etapa;
  if (etapa === 'perdido'){ modalPerdido(id, desde); return; }
  CRM.moverLead(id, etapa);
  refrescar();
  if (leadAbierto === id) abrirLead(id);
  if (etapa === 'firmado'){
    confeti(90);
    toast('🏆 ¡' + l.nombre + ' FIRMÓ!', 'Una franquicia más en la red. +100 XP', 'Deshacer', function(){ CRM.moverLead(id, desde); refrescar(); });
    chequearLogro();
  } else {
    toast('Lead movido a ' + CRM.etiquetaEtapa(etapa), l.nombre, 'Deshacer', function(){ CRM.moverLead(id, desde); refrescar(); });
    /* filosofía "next activity": pedir la próxima acción */
    setTimeout(function(){ modalProximaAccion(id); }, 350);
  }
}
function menuMover(id, btn){
  var l = CRM.lead(id);
  var opciones = CRM.ETAPAS.filter(function(e){ return e.id !== l.etapa; })
    .map(function(e){ return '<button class="cmdk-item" style="width:100%" onclick="moverCon(\'' + id + '\',\'' + e.id + '\');cerrarModal()"><span class="e">' + e.emoji + '</span>' + e.nombre + '</button>'; }).join('') +
    '<button class="cmdk-item" style="width:100%;color:var(--rojo-luz)" onclick="moverCon(\'' + id + '\',\'perdido\');"><span class="e">✕</span>Marcar como perdido</button>';
  abrirModal('<h3 style="font-size:17px;margin-bottom:12px">Mover a ' + esc(l.nombre) + '</h3>' + opciones +
    '<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="cerrarModal()">Cancelar</button>');
}
function modalPerdido(id, desde){
  var l = CRM.lead(id);
  abrirModal('<h3 style="font-size:17px;margin-bottom:6px">✕ Marcar como perdido</h3>' +
    '<p style="font-size:13px;color:var(--tinta3);margin-bottom:14px">' + esc(l.nombre) + ' — ¿por qué se pierde? Esto alimenta las métricas.</p>' +
    ['Sin capital por ahora', 'Eligió otro rubro', 'No contesta', 'Zona sin disponibilidad', 'Otro'].map(function(m){
      return '<button class="cmdk-item" style="width:100%" onclick="confirmarPerdido(\'' + id + '\',\'' + desde + '\',\'' + m + '\')"><span class="e">▸</span>' + m + '</button>';
    }).join('') +
    '<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="cerrarModal()">Cancelar</button>');
}
function confirmarPerdido(id, desde, motivo){
  cerrarModal();
  var l = CRM.lead(id);
  CRM.moverLead(id, 'perdido');
  CRM.state().leads.find(function(x){ return x.id === id; }).motivoPerdida = motivo;
  CRM.save(); refrescar();
  toast('Lead marcado como perdido', motivo, 'Deshacer', function(){
    var lx = CRM.state().leads.find(function(x){ return x.id === id; });
    if (lx) delete lx.motivoPerdida;
    CRM.moverLead(id, desde); refrescar();
  });
}
function modalProximaAccion(id){
  var l = CRM.lead(id);
  if (!l || l.etapa === 'firmado' || l.etapa === 'perdido') return;
  abrirModal('<h3 style="font-size:17px;margin-bottom:6px">📌 ¿Cuál es la próxima acción?</h3>' +
    '<p style="font-size:13px;color:var(--tinta3);margin-bottom:14px">Un lead sin próxima acción es un lead que se enfría. (Filosofía Pipedrive)</p>' +
    [['📞', 'Llamarlo mañana'], ['💬', 'Mandarle WhatsApp con la proyección'], ['🤝', 'Agendar reunión'], ['🏪', 'Coordinar visita al local']].map(function(a){
      return '<button class="cmdk-item" style="width:100%" onclick="CRM.agregarActividad(\'' + id + '\',\'tarea\',\'Próxima acción: ' + a[1] + '\');cerrarModal();refrescar();toast(\'📌 Próxima acción agendada\',\'' + a[1] + ' · +5 XP\')"><span class="e">' + a[0] + '</span>' + a[1] + '</button>';
    }).join('') +
    '<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="cerrarModal()">Ahora no</button>');
}

var reglasTemp = null;
function rScoring(el){

function cambiarRegla(k, i, d){
  reglasTemp[k][i] = Math.max(0, Math.min(40, reglasTemp[k][i] + d));
  $('#rg-' + k + '-' + i).textContent = reglasTemp[k][i];
  renderPreview();
}
function cambiarBonus(d){
  reglasTemp.necesitaBonus = Math.max(0, Math.min(10, reglasTemp.necesitaBonus + d));
  $('#rg-bonus').textContent = reglasTemp.necesitaBonus;
  renderPreview();
}
function cambiarUmbral(k, v){
  reglasTemp[k] = +v;
  if (reglasTemp.umbralTibio >= reglasTemp.umbralCaliente) reglasTemp.umbralTibio = reglasTemp.umbralCaliente - 5;
  $('#lblCal').textContent = reglasTemp.umbralCaliente + ' puntos';
  $('#lblTib').textContent = reglasTemp.umbralTibio + ' puntos';
  if ($('#rngCal')) $('#rngCal').value = reglasTemp.umbralCaliente;
  if ($('#rngTib')) $('#rngTib').value = reglasTemp.umbralTibio;
  renderPreview();
}

  /* impacto en vivo sobre toda la base con las reglas temporales */
  var ls = CRM.state().leads, seg = { caliente: 0, tibio: 0, frio: 0 }, cambios = 0;

  $('#scPreview').innerHTML =
    '<div class="card" style="border-color:rgba(242,183,5,.4)"><b style="font-family:var(--disp);font-size:14px">⚡ Impacto en vivo</b>' +

    }).join('') + '</div>';
}
function guardarReglas(){

    stats.map(function(s, i){

/* ═══════════════ command palette ═══════════════ */
var cmdkSel = 0;
function abrirCmdk(){ $('#cmdk').classList.add('open'); $('#cmdkInput').value = ''; renderCmdk(''); setTimeout(function(){ $('#cmdkInput').focus(); }, 40); }
function cerrarCmdk(){ $('#cmdk').classList.remove('open'); }
function itemsCmdk(q){
  q = q.toLowerCase();
  var acciones = [
    { e: '📊', t: 'Ir al Dashboard', k: 'G D', fn: function(){ ir('dashboard'); } },
    { e: '🧲', t: 'Ir al Pipeline', k: 'G P', fn: function(){ ir('pipeline'); } },
    { e: '🎛️', t: 'Ir a Scoring', k: 'G S', fn: function(){ ir('scoring'); } },
    { e: '🏆', t: 'Ir a Equipo y logros', k: '', fn: function(){ ir('equipo'); } },
    { e: '＋', t: 'Crear nuevo lead', k: 'N', fn: abrirNuevoLead },
    { e: '⬇️', t: 'Exportar leads a CSV', k: '', fn: descargarCSV },
    { e: '🌐', t: 'Abrir la landing (lado cliente)', k: '', fn: function(){ location.href = 'landing.html'; } }
  ].filter(function(a){ return !q || a.t.toLowerCase().indexOf(q) >= 0; });
  var leads = q ? CRM.leads().filter(function(l){ return (l.nombre + ' ' + l.zona).toLowerCase().indexOf(q) >= 0; }).slice(0, 6)
    .map(function(l){ return { e: l.segmento.emoji, t: l.nombre + ' · ' + CRM.etiquetaEtapa(l.etapa) + ' · score ' + l.score, k: '', fn: function(){ abrirLead(l.id); } }; }) : [];
  return leads.concat(acciones);
}
function renderCmdk(q){
  var items = itemsCmdk(q);
  cmdkSel = Math.min(cmdkSel, Math.max(0, items.length - 1));
  $('#cmdkList').innerHTML = items.length ? items.map(function(it, i){
    return '<div class="cmdk-item' + (i === cmdkSel ? ' sel' : '') + '" data-i="' + i + '"><span class="e">' + it.e + '</span>' + esc(it.t) +
      (it.k ? '<kbd>' + it.k + '</kbd>' : '') + '</div>';
  }).join('') : '<div class="empty-col" style="margin:10px">Nada con "' + esc(q) + '" 🤷</div>';
  /* acotado a la lista del palette: los modales usan .cmdk-item solo como estilo */
  $$('.cmdk-item', $('#cmdkList')).forEach(function(n){
    n.onclick = function(){ var it = itemsCmdk($('#cmdkInput').value)[+n.dataset.i]; cerrarCmdk(); it.fn(); };
  });
}
$('#cmdkInput').addEventListener('input', function(){ cmdkSel = 0; renderCmdk(this.value); });
$('#cmdkInput').addEventListener('keydown', function(e){
  var items = itemsCmdk(this.value);
  if (e.key === 'ArrowDown'){ e.preventDefault(); cmdkSel = Math.min(cmdkSel + 1, items.length - 1); renderCmdk(this.value); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); cmdkSel = Math.max(cmdkSel - 1, 0); renderCmdk(this.value); }
  else if (e.key === 'Enter' && items[cmdkSel]){ cerrarCmdk(); items[cmdkSel].fn(); }
});
$('#cmdk').addEventListener('click', function(e){ if (e.target.id === 'cmdk') cerrarCmdk(); });

/* ═══════════════ atajos globales ═══════════════ */
var gPrimida = false, gTimer = null;
document.addEventListener('keydown', function(e){
  var enInput = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); abrirCmdk(); return; }
  if (e.key === 'Escape'){
    if ($('#cmdk').classList.contains('open')) cerrarCmdk();
    else if ($('#modal').classList.contains('open')) cerrarModal();
    else cerrarDrawer();
    return;
  }
  if (enInput) return;
  if (e.key === '?'){ ir('glosario'); return; }
  if (e.key.toLowerCase() === 'n'){ abrirNuevoLead(); return; }
  if (e.key.toLowerCase() === 'g'){ gPrimida = true; clearTimeout(gTimer); gTimer = setTimeout(function(){ gPrimida = false; }, 900); return; }
  if (gPrimida){
    var map = { d: 'dashboard', p: 'pipeline', s: 'scoring', l: 'leads', e: 'equipo', c: 'config' };
    var v = map[e.key.toLowerCase()];
    if (v) ir(v);
    gPrimida = false;
  }
});

window.addEventListener('crm:cambio', function(){ renderGam(); });
/* otra pestaña escribió (p.ej. el wizard de la landing): refrescar la vista */
window.addEventListener('storage', function(e){ if (e && e.key === 'chisap_crm_v1') refrescar(); });

/* mobile: botón hamburguesa simple */
(function(){
  /* siempre en el DOM: el CSS decide cuándo mostrarlo (rotaciones, resize) */
  var burger = document.createElement('button');
  burger.className = 'btn btn-ghost btn-sm burger-btn';
  burger.textContent = '☰ Menú';
  burger.onclick = function(){ $('#sidebar').classList.toggle('open'); };
  document.body.appendChild(burger);
})();

/* botón atrás del navegador */
window.addEventListener('hashchange', function(){
  var h = (location.hash || '').replace('#/', '');
  if (VISTAS[h] && h !== vistaActual) ir(h);
});

/* arranque */
var hash = (location.hash || '').replace('#/', '');
ir(VISTAS[hash] ? hash : 'dashboard');
tourBienvenida();
</script>
</body>
